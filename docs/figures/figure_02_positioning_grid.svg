<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, sans-serif" font-size="13">
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Positioning of VisClick against existing automation approaches</text>

  <line x1="120" y1="540" x2="820" y2="540" stroke="#222" stroke-width="2"/>
  <line x1="470" y1="80"  x2="470" y2="600" stroke="#222" stroke-width="2"/>

  <text x="120" y="565" font-size="13" font-style="italic">lightweight</text>
  <text x="820" y="565" font-size="13" font-style="italic" text-anchor="end">heavyweight</text>
  <text x="470" y="600" font-size="13" font-style="italic" text-anchor="middle">compute / model size</text>

  <text x="60"  y="80" font-size="13" font-style="italic">tolerant</text>
  <text x="60"  y="540" font-size="13" font-style="italic">brittle</text>
  <g transform="rotate(-90 50 310)"><text x="50" y="310" text-anchor="middle" font-size="13" font-style="italic">theme / DPI tolerance</text></g>

  <rect x="160" y="380" width="130" height="80" rx="6" fill="#fdeaea" stroke="#a74545"/>
  <text x="225" y="405" text-anchor="middle" font-weight="bold" font-size="13">SikuliX</text>
  <text x="225" y="425" text-anchor="middle" font-size="11" fill="#666">PyAutoGUI</text>
  <text x="225" y="448" text-anchor="middle" font-size="11" fill="#a74545">brittle to theme</text>

  <rect x="320" y="380" width="130" height="80" rx="6" fill="#fdeaea" stroke="#a74545" stroke-dasharray="5 3"/>
  <text x="385" y="408" text-anchor="middle" font-weight="bold" font-size="13" fill="#888">pywinauto</text>
  <text x="385" y="428" text-anchor="middle" font-size="11" fill="#888">accessibility-tree</text>
  <text x="385" y="448" text-anchor="middle" font-size="11" fill="#888" font-style="italic">fails on Win11 native</text>

  <rect x="600" y="120" width="160" height="100" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="680" y="148" text-anchor="middle" font-weight="bold" font-size="13">SeeClick</text>
  <text x="680" y="170" text-anchor="middle" font-size="11" fill="#666">ScreenAI</text>
  <text x="680" y="190" text-anchor="middle" font-size="11" fill="#666">UI-TARS</text>
  <text x="680" y="210" text-anchor="middle" font-size="11" fill="#3a5fb5">9 GB VRAM, GPU req</text>

  <rect x="370" y="240" width="200" height="90" rx="8" fill="#fff5e0" stroke="#c08a2c" stroke-width="2.5"/>
  <text x="470" y="270" text-anchor="middle" font-weight="bold" font-size="15">VisClick (this project)</text>
  <text x="470" y="293" text-anchor="middle" font-size="11" fill="#444">YOLOv8s (45 MB ONNX)</text>
  <text x="470" y="312" text-anchor="middle" font-size="11" fill="#444">CPU only, theme-tolerant</text>
  <text x="470" y="328" text-anchor="middle" font-size="11" fill="#c08a2c" font-style="italic">middle-of-grid niche</text>

  <text x="225" y="490" text-anchor="middle" font-size="11" fill="#666">image-based</text>
  <text x="385" y="490" text-anchor="middle" font-size="11" fill="#666">accessibility-tree</text>
  <text x="680" y="490" text-anchor="middle" font-size="11" fill="#666">large vision-language</text>
</svg>
