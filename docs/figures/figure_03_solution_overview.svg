<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold">High-level solution architecture</text>
  <text x="500" y="48" text-anchor="middle" font-size="12" fill="#555">Mobile-pretrained detector + adaptation + IVGocr-style instruction-to-action pipeline</text>

  <rect x="40" y="100" width="180" height="60" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="130" y="125" text-anchor="middle" font-weight="bold">labelled mobile data</text>
  <text x="130" y="145" text-anchor="middle" font-size="11">RICO + CLAY + VINS</text>

  <rect x="40" y="200" width="180" height="60" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="130" y="225" text-anchor="middle" font-weight="bold">YOLOv8s training</text>
  <text x="130" y="245" text-anchor="middle" font-size="11">8000 src / 1000 val</text>
  <line x1="130" y1="160" x2="130" y2="200" stroke="#222" stroke-width="1.5" marker-end="url(#ar3)"/>

  <rect x="280" y="200" width="180" height="60" rx="6" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="370" y="225" text-anchor="middle" font-weight="bold">source detector</text>
  <text x="370" y="245" text-anchor="middle" font-size="11">mAP@0.5 = 0.450</text>
  <line x1="220" y1="230" x2="280" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#ar3)"/>

  <rect x="280" y="100" width="180" height="60" rx="6" fill="#fdeaea" stroke="#a74545"/>
  <text x="370" y="120" text-anchor="middle" font-weight="bold" font-size="12">domain shift</text>
  <text x="370" y="138" text-anchor="middle" font-size="10">portrait -> landscape</text>
  <text x="370" y="152" text-anchor="middle" font-size="10">touch -> mouse / theme</text>
  <line x1="370" y1="160" x2="370" y2="200" stroke="#a74545" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar3)"/>

  <rect x="520" y="120" width="180" height="48" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="610" y="148" text-anchor="middle" font-size="12">few-shot fine-tune</text>

  <rect x="520" y="178" width="180" height="48" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="610" y="206" text-anchor="middle" font-size="12">SSP+FT (SimSiam)</text>

  <rect x="520" y="236" width="180" height="48" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="610" y="264" text-anchor="middle" font-size="12">UDA (AT / SHOT)</text>

  <line x1="460" y1="220" x2="520" y2="144" stroke="#222" stroke-width="1.2" marker-end="url(#ar3)"/>
  <line x1="460" y1="230" x2="520" y2="202" stroke="#222" stroke-width="1.2" marker-end="url(#ar3)"/>
  <line x1="460" y1="240" x2="520" y2="260" stroke="#222" stroke-width="1.2" marker-end="url(#ar3)"/>

  <rect x="760" y="180" width="200" height="60" rx="6" fill="#fff5e0" stroke="#c08a2c" stroke-width="2"/>
  <text x="860" y="205" text-anchor="middle" font-weight="bold">adapted desktop detector</text>
  <text x="860" y="225" text-anchor="middle" font-size="11">visclick.onnx (45 MB)</text>
  <line x1="700" y1="200" x2="760" y2="208" stroke="#222" stroke-width="1.5" marker-end="url(#ar3)"/>

  <rect x="200" y="340" width="600" height="80" rx="8" fill="#f0eaff" stroke="#5a3eaa" stroke-width="2"/>
  <text x="500" y="367" text-anchor="middle" font-weight="bold" font-size="14">IVGocr-style instruction-to-action pipeline (visclick.bot)</text>
  <text x="500" y="390" text-anchor="middle" font-size="11">capture -> detect -> per-box OCR -> match (rapidfuzz + class bonus) -> act</text>
  <text x="500" y="408" text-anchor="middle" font-size="11" fill="#5a3eaa">three-branch refusal rule; per-attempt CSV evidence</text>

  <line x1="860" y1="240" x2="700" y2="340" stroke="#222" stroke-width="1.5" marker-end="url(#ar3)"/>

  <text x="500" y="455" text-anchor="middle" font-size="12" fill="#666">deliverable prototype: GUI + bot + evaluation harness on standardised T01-T15</text>
</svg>
