<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold">Modular vs end-to-end grounding pipelines</text>

  <text x="245" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c8a3c">Modular (this project, IVGocr family)</text>
  <text x="755" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3eaa">End-to-end LVLM (SeeClick, ScreenAI, UI-TARS)</text>

  <line x1="500" y1="60" x2="500" y2="440" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="100" y="100" width="290" height="50" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="245" y="130" text-anchor="middle" font-weight="bold">screenshot + instruction text</text>

  <rect x="100" y="170" width="290" height="50" rx="6" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="245" y="190" text-anchor="middle" font-weight="bold">stage 1: detect (CV)</text>
  <text x="245" y="208" text-anchor="middle" font-size="11">YOLOv8s -> bounding boxes</text>

  <rect x="100" y="240" width="290" height="50" rx="6" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="245" y="260" text-anchor="middle" font-weight="bold">stage 2: read (OCR)</text>
  <text x="245" y="278" text-anchor="middle" font-size="11">EasyOCR per-box + full-image fallback</text>

  <rect x="100" y="310" width="290" height="50" rx="6" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="245" y="330" text-anchor="middle" font-weight="bold">stage 3: match (rapidfuzz)</text>
  <text x="245" y="348" text-anchor="middle" font-size="11">fuzzy similarity + class bonus</text>

  <rect x="100" y="380" width="290" height="50" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="245" y="410" text-anchor="middle" font-weight="bold">action: click / type</text>

  <line x1="245" y1="150" x2="245" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#ar6)"/>
  <line x1="245" y1="220" x2="245" y2="240" stroke="#222" stroke-width="1.5" marker-end="url(#ar6)"/>
  <line x1="245" y1="290" x2="245" y2="310" stroke="#222" stroke-width="1.5" marker-end="url(#ar6)"/>
  <line x1="245" y1="360" x2="245" y2="380" stroke="#222" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="610" y="100" width="290" height="50" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="755" y="130" text-anchor="middle" font-weight="bold">screenshot + instruction text</text>

  <rect x="610" y="195" width="290" height="160" rx="8" fill="#f0eaff" stroke="#5a3eaa" stroke-width="2"/>
  <text x="755" y="225" text-anchor="middle" font-weight="bold">large vision-language model</text>
  <text x="755" y="248" text-anchor="middle" font-size="11">5B-9B parameters, GPU-bound</text>
  <text x="755" y="272" text-anchor="middle" font-size="11">multi-modal embedding</text>
  <text x="755" y="295" text-anchor="middle" font-size="11">token-level coordinate output</text>
  <text x="755" y="335" text-anchor="middle" font-size="11" fill="#5a3eaa" font-style="italic">no separable internal stages</text>

  <rect x="610" y="380" width="290" height="50" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="755" y="410" text-anchor="middle" font-weight="bold">action: click / type</text>

  <line x1="755" y1="150" x2="755" y2="195" stroke="#222" stroke-width="1.5" marker-end="url(#ar6)"/>
  <line x1="755" y1="355" x2="755" y2="380" stroke="#222" stroke-width="1.5" marker-end="url(#ar6)"/>

  <text x="245" y="465" text-anchor="middle" font-size="12" fill="#3c8a3c">CPU only, 45 MB ONNX, every stage independently testable</text>
  <text x="755" y="465" text-anchor="middle" font-size="12" fill="#5a3eaa">GPU only, 9+ GB VRAM, end-to-end black-box</text>
</svg>
