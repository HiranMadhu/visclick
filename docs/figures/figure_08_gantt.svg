<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="Arial, sans-serif" font-size="12">
  <text x="550" y="28" text-anchor="middle" font-size="18" font-weight="bold">Project Gantt chart over the 12 months of the MSc</text>
  <text x="550" y="48" text-anchor="middle" font-size="12" fill="#555">Phase boundaries deliberately overlap; documentation continued while next phase's experiments began.</text>

  <line x1="220" y1="100" x2="220" y2="380" stroke="#888"/>
  <line x1="220" y1="380" x2="1060" y2="380" stroke="#222"/>
  <line x1="220" y1="100" x2="1060" y2="100" stroke="#888"/>

  <g font-size="11" text-anchor="middle" fill="#444">
    <text x="255"  y="395">M1</text>
    <text x="325"  y="395">M2</text>
    <text x="395"  y="395">M3</text>
    <text x="465"  y="395">M4</text>
    <text x="535"  y="395">M5</text>
    <text x="605"  y="395">M6</text>
    <text x="675"  y="395">M7</text>
    <text x="745"  y="395">M8</text>
    <text x="815"  y="395">M9</text>
    <text x="885"  y="395">M10</text>
    <text x="955"  y="395">M11</text>
    <text x="1025" y="395">M12</text>
  </g>

  <g stroke="#ddd" stroke-dasharray="2 3">
    <line x1="290" y1="100" x2="290" y2="380"/>
    <line x1="360" y1="100" x2="360" y2="380"/>
    <line x1="430" y1="100" x2="430" y2="380"/>
    <line x1="500" y1="100" x2="500" y2="380"/>
    <line x1="570" y1="100" x2="570" y2="380"/>
    <line x1="640" y1="100" x2="640" y2="380"/>
    <line x1="710" y1="100" x2="710" y2="380"/>
    <line x1="780" y1="100" x2="780" y2="380"/>
    <line x1="850" y1="100" x2="850" y2="380"/>
    <line x1="920" y1="100" x2="920" y2="380"/>
    <line x1="990" y1="100" x2="990" y2="380"/>
  </g>

  <text x="20"  y="138" font-size="13" font-weight="bold">Phase 1</text>
  <text x="20"  y="155" font-size="11" fill="#666">Discovery &amp; Setup</text>
  <rect x="220" y="125" width="245" height="30" fill="#3a5fb5" opacity="0.85"/>
  <text x="343" y="146" text-anchor="middle" font-size="11" fill="white">M1-M3</text>

  <text x="20"  y="208" font-size="13" font-weight="bold">Phase 2</text>
  <text x="20"  y="225" font-size="11" fill="#666">Source-domain training</text>
  <rect x="395" y="195" width="350" height="30" fill="#c08a2c" opacity="0.85"/>
  <text x="570" y="216" text-anchor="middle" font-size="11" fill="white">M4-M7 (overlaps Phase 1 by 1 mo)</text>

  <text x="20"  y="278" font-size="13" font-weight="bold">Phase 3</text>
  <text x="20"  y="295" font-size="11" fill="#666">Adaptation &amp; transfer</text>
  <rect x="675" y="265" width="210" height="30" fill="#3c8a3c" opacity="0.85"/>
  <text x="780" y="286" text-anchor="middle" font-size="11" fill="white">M8-M9</text>

  <text x="20"  y="348" font-size="13" font-weight="bold">Phase 4</text>
  <text x="20"  y="365" font-size="11" fill="#666">Prototype + report</text>
  <rect x="815" y="335" width="245" height="30" fill="#5a3eaa" opacity="0.85"/>
  <text x="938" y="356" text-anchor="middle" font-size="11" fill="white">M10-M12</text>

  <line x1="395" y1="120" x2="395" y2="225" stroke="#a74545" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="675" y1="190" x2="675" y2="295" stroke="#a74545" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="815" y1="260" x2="815" y2="365" stroke="#a74545" stroke-width="1.2" stroke-dasharray="3 3"/>

  <text x="430" y="437" text-anchor="middle" font-size="10" fill="#a74545">phase boundary</text>
  <text x="430" y="450" text-anchor="middle" font-size="10" fill="#a74545">(1 month overlap)</text>

  <text x="710" y="437" text-anchor="middle" font-size="10" fill="#a74545">phase boundary</text>
  <text x="850" y="437" text-anchor="middle" font-size="10" fill="#a74545">phase boundary</text>
</svg>
