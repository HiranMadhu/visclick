<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <linearGradient id="layerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f8ff"/>
      <stop offset="100%" stop-color="#dde7fb"/>
    </linearGradient>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">VisClick six-layer architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#555">Acyclic dependency graph; each layer realised as one Python module</text>

  <rect x="70"  y="80"  width="120" height="60" rx="6" fill="url(#layerGrad)" stroke="#3a5fb5" stroke-width="1.5"/>
  <text x="130" y="105" text-anchor="middle" font-weight="bold">capture</text>
  <text x="130" y="125" text-anchor="middle" font-size="11" fill="#444">mss + monitor offset</text>

  <rect x="220" y="80"  width="120" height="60" rx="6" fill="url(#layerGrad)" stroke="#3a5fb5" stroke-width="1.5"/>
  <text x="280" y="105" text-anchor="middle" font-weight="bold">detect</text>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#444">YOLOv8s ONNX</text>

  <rect x="370" y="80"  width="120" height="60" rx="6" fill="url(#layerGrad)" stroke="#3a5fb5" stroke-width="1.5"/>
  <text x="430" y="105" text-anchor="middle" font-weight="bold">ocr</text>
  <text x="430" y="125" text-anchor="middle" font-size="11" fill="#444">EasyOCR / Tesseract</text>

  <rect x="520" y="80"  width="120" height="60" rx="6" fill="url(#layerGrad)" stroke="#3a5fb5" stroke-width="1.5"/>
  <text x="580" y="105" text-anchor="middle" font-weight="bold">match</text>
  <text x="580" y="125" text-anchor="middle" font-size="11" fill="#444">rapidfuzz + class bonus</text>

  <rect x="670" y="80"  width="120" height="60" rx="6" fill="url(#layerGrad)" stroke="#3a5fb5" stroke-width="1.5"/>
  <text x="730" y="105" text-anchor="middle" font-weight="bold">act</text>
  <text x="730" y="125" text-anchor="middle" font-size="11" fill="#444">PyAutoGUI</text>

  <rect x="295" y="200" width="310" height="60" rx="6" fill="#fff5e0" stroke="#c08a2c" stroke-width="1.5"/>
  <text x="450" y="225" text-anchor="middle" font-weight="bold">bot (orchestrator)</text>
  <text x="450" y="245" text-anchor="middle" font-size="11" fill="#444">composes layers; refusal rule; per-attempt CSV</text>

  <rect x="120" y="320" width="260" height="60" rx="6" fill="#eaf6ea" stroke="#3c8a3c" stroke-width="1.5"/>
  <text x="250" y="345" text-anchor="middle" font-weight="bold">visclick.gui (Tk)</text>
  <text x="250" y="365" text-anchor="middle" font-size="11" fill="#444">user input, countdown, overlay thumbnail</text>

  <rect x="520" y="320" width="260" height="60" rx="6" fill="#fdeaea" stroke="#a74545" stroke-width="1.5"/>
  <text x="650" y="345" text-anchor="middle" font-weight="bold">scripts/run_baselines.py</text>
  <text x="650" y="365" text-anchor="middle" font-size="11" fill="#444">eval harness; 4 baseline adapters</text>

  <rect x="280" y="450" width="340" height="50" rx="6" fill="#f0eaff" stroke="#5a3eaa" stroke-width="1.5"/>
  <text x="450" y="478" text-anchor="middle" font-weight="bold">reports/tables/*.csv (canonical evidence)</text>

  <line x1="190" y1="110" x2="220" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="110" x2="370" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="110" x2="520" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="110" x2="670" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="450" y1="140" x2="450" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="460" y="175" font-size="11" fill="#666">composes</text>

  <line x1="380" y1="260" x2="280" y2="320" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="520" y1="260" x2="620" y2="320" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>

  <line x1="250" y1="380" x2="380" y2="450" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="650" y1="380" x2="520" y2="450" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
</svg>
