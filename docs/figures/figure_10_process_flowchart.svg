<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar10" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Per-instruction process flow</text>

  <ellipse cx="450" cy="70" rx="80" ry="22" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="450" y="76" text-anchor="middle" font-weight="bold">user instruction</text>

  <rect x="370" y="115" width="160" height="40" rx="4" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="450" y="140" text-anchor="middle">capture screenshot</text>
  <line x1="450" y1="92" x2="450" y2="115" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <rect x="370" y="175" width="160" height="40" rx="4" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="450" y="200" text-anchor="middle">detect (YOLOv8s)</text>
  <line x1="450" y1="155" x2="450" y2="175" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <polygon points="450,235 560,275 450,315 340,275" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="450" y="278" text-anchor="middle" font-weight="bold">N candidates</text>
  <text x="450" y="294" text-anchor="middle" font-size="11">N &gt; 0?</text>
  <line x1="450" y1="215" x2="450" y2="235" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <text x="565" y="265" font-size="11" font-weight="bold" fill="#3c8a3c">Yes</text>
  <text x="335" y="265" text-anchor="end" font-size="11" font-weight="bold" fill="#a74545">No</text>

  <rect x="370" y="335" width="160" height="40" rx="4" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="450" y="360" text-anchor="middle">per-box OCR</text>
  <line x1="450" y1="315" x2="450" y2="335" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <rect x="370" y="395" width="160" height="40" rx="4" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="450" y="420" text-anchor="middle">match (rapidfuzz)</text>
  <line x1="450" y1="375" x2="450" y2="395" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <polygon points="450,455 560,495 450,535 340,495" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="450" y="498" text-anchor="middle" font-weight="bold">top score</text>
  <text x="450" y="514" text-anchor="middle" font-size="11">&gt;= threshold?</text>
  <line x1="450" y1="435" x2="450" y2="455" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <text x="565" y="485" font-size="11" font-weight="bold" fill="#3c8a3c">Yes</text>
  <text x="335" y="485" text-anchor="end" font-size="11" font-weight="bold" fill="#a74545">No (retry)</text>

  <rect x="370" y="555" width="160" height="40" rx="4" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="450" y="580" text-anchor="middle" font-weight="bold">action: click_box</text>
  <line x1="450" y1="535" x2="450" y2="555" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <rect x="80"  y="355" width="170" height="40" rx="4" fill="#fdeaea" stroke="#a74545"/>
  <text x="165" y="380" text-anchor="middle">full-image OCR fallback</text>
  <line x1="340" y1="275" x2="180" y2="355" stroke="#a74545" stroke-width="1.5" marker-end="url(#ar10)"/>

  <line x1="340" y1="495" x2="200" y2="395" stroke="#a74545" stroke-width="1.5" marker-end="url(#ar10)"/>

  <polygon points="165,415 250,455 165,495 80,455" fill="#fdeaea" stroke="#a74545"/>
  <text x="165" y="458" text-anchor="middle" font-size="11" font-weight="bold">match</text>
  <text x="165" y="474" text-anchor="middle" font-size="11">found?</text>
  <line x1="165" y1="395" x2="165" y2="415" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <rect x="80"  y="540" width="170" height="40" rx="4" fill="#fdeaea" stroke="#a74545"/>
  <text x="165" y="565" text-anchor="middle" font-weight="bold">refuse</text>
  <line x1="165" y1="495" x2="165" y2="540" stroke="#a74545" stroke-width="1.5" marker-end="url(#ar10)"/>
  <text x="100" y="525" font-size="11" fill="#a74545">No</text>

  <line x1="250" y1="455" x2="370" y2="575" stroke="#3c8a3c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar10)"/>
  <text x="290" y="475" font-size="11" fill="#3c8a3c">Yes</text>

  <rect x="370" y="630" width="160" height="40" rx="4" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="450" y="655" text-anchor="middle">log row to CSV</text>
  <line x1="450" y1="595" x2="450" y2="630" stroke="#222" stroke-width="1.5" marker-end="url(#ar10)"/>

  <line x1="80"  y1="560" x2="20" y2="560" stroke="#a74545" stroke-width="1"/>
  <line x1="20"  y1="560" x2="20" y2="650" stroke="#a74545" stroke-width="1"/>
  <line x1="20"  y1="650" x2="370" y2="650" stroke="#a74545" stroke-width="1" marker-end="url(#ar10)"/>
</svg>
