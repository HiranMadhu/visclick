<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .abs { fill: #fff8f0; stroke: #c17222; stroke-width: 2; }
    .concrete { fill: #f0fff0; stroke: #2e7d32; stroke-width: 1.5; }
    .dc { fill: #f5f5f5; stroke: #666666; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .title { font-weight: bold; font-size: 13px; text-anchor: middle; }
    .stereo { font-style: italic; font-size: 10px; fill: #666666; text-anchor: middle; }
    .attr { font-family: "Courier New", monospace; font-size: 10.5px; }
    .method { font-family: "Courier New", monospace; font-size: 10.5px; }
    .sep { stroke: #333333; stroke-width: 1; }
    .inherit { stroke: #333333; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
    .use { stroke: #666666; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .diamond-open { fill: #ffffff; stroke: #333333; stroke-width: 1.4; }
    .arrow { fill: #333333; }
    .caption { font-size: 11px; fill: #555555; }
  </style>

  <text x="750" y="28" text-anchor="middle" font-size="18" font-weight="bold">VisClick &#8212; Baseline Class Hierarchy</text>
  <text x="750" y="48" text-anchor="middle" font-size="12" fill="#555555">The four click-baseline methods (three classical, one neural) subclass a single Baseline ABC. Each instance returns a BaselineResult, which the runner writes to CSV.</text>

  <!-- Baseline ABC (top center) -->
  <g id="Baseline">
    <rect x="600" y="90" width="300" height="150" rx="4" class="abs"/>
    <text x="750" y="108" class="stereo">&lt;&lt;abstract&gt;&gt;  &lt;&lt;interface&gt;&gt;</text>
    <text x="750" y="125" class="title">Baseline</text>
    <line x1="600" y1="132" x2="900" y2="132" class="sep"/>
    <text x="610" y="148" class="attr">+ name: str        # subclass sets</text>
    <line x1="600" y1="154" x2="900" y2="154" class="sep"/>
    <text x="610" y="170" class="method">+ predict(image_rgb: ndarray,</text>
    <text x="610" y="184" class="method">      instruction: str,</text>
    <text x="610" y="198" class="method">      *, offset=(0,0),</text>
    <text x="610" y="212" class="method">      **kwargs) &#8594; BaselineResult</text>
    <text x="610" y="226" class="attr" fill="#a15015">   @abstractmethod</text>
  </g>

  <!-- BaselineResult (right, dataclass, used-by) -->
  <g id="BaselineResult">
    <rect x="1000" y="90" width="470" height="180" rx="4" class="dc"/>
    <text x="1235" y="108" class="stereo">&lt;&lt;dataclass&gt;&gt;</text>
    <text x="1235" y="125" class="title">BaselineResult</text>
    <line x1="1000" y1="132" x2="1470" y2="132" class="sep"/>
    <text x="1010" y="148" class="attr">+ method: str            # 'template' | 'ocr_only' | ...</text>
    <text x="1010" y="162" class="attr">+ found: bool</text>
    <text x="1010" y="176" class="attr">+ xy: (int, int) | None      # virtual-desktop pixel</text>
    <text x="1010" y="190" class="attr">+ bbox: (x1,y1,x2,y2) | None</text>
    <text x="1010" y="204" class="attr">+ confidence: float 0..1</text>
    <text x="1010" y="218" class="attr">+ elapsed_ms: float</text>
    <text x="1010" y="232" class="attr">+ notes: str</text>
    <text x="1010" y="246" class="attr">+ verdict: str | None      # runner attaches</text>
    <line x1="1000" y1="252" x2="1470" y2="252" class="sep"/>
    <text x="1010" y="266" class="method">+ to_csv_row() &#8594; dict</text>
  </g>

  <!-- 4 concrete subclasses in a row -->
  <g id="TemplateBaseline">
    <rect x="40" y="360" width="330" height="230" rx="4" class="concrete"/>
    <text x="205" y="378" class="stereo">&lt;&lt;classical / SikuliX-style&gt;&gt;</text>
    <text x="205" y="395" class="title">TemplateBaseline</text>
    <line x1="40" y1="402" x2="370" y2="402" class="sep"/>
    <text x="50" y="418" class="attr">- templates_dir: Path</text>
    <text x="50" y="432" class="attr">- threshold: float ( = 0.7 )</text>
    <line x1="40" y1="438" x2="370" y2="438" class="sep"/>
    <text x="50" y="454" class="method">+ __init__(templates_dir=None,</text>
    <text x="50" y="468" class="method">           threshold=0.7)</text>
    <text x="50" y="482" class="method">+ predict(img, instr,</text>
    <text x="50" y="496" class="method">      target_template=, offset=)</text>
    <text x="50" y="510" class="method">   &#8594; BaselineResult</text>
    <text x="50" y="524" class="method">- _do_match(img, tpl)</text>
    <text x="50" y="548" class="attr" fill="#666">cv2.matchTemplate at 3 scales</text>
    <text x="50" y="562" class="attr" fill="#666">TM_CCOEFF_NORMED correlation</text>
    <text x="50" y="576" class="attr" fill="#666">name = "template"</text>
  </g>

  <g id="OCRBaseline">
    <rect x="400" y="360" width="330" height="230" rx="4" class="concrete"/>
    <text x="565" y="378" class="stereo">&lt;&lt;classical / OCR-only&gt;&gt;</text>
    <text x="565" y="395" class="title">OCRBaseline</text>
    <line x1="400" y1="402" x2="730" y2="402" class="sep"/>
    <text x="410" y="418" class="attr">- engine: str ( = "easyocr" )</text>
    <text x="410" y="432" class="attr">- min_similarity: int ( = 70 )</text>
    <line x1="400" y1="438" x2="730" y2="438" class="sep"/>
    <text x="410" y="454" class="method">+ __init__(engine="easyocr",</text>
    <text x="410" y="468" class="method">           min_similarity=70)</text>
    <text x="410" y="482" class="method">+ predict(img, instr,</text>
    <text x="410" y="496" class="method">      target_text=, offset=)</text>
    <text x="410" y="510" class="method">   &#8594; BaselineResult</text>
    <text x="410" y="524" class="method">- _ground(img, target, ...)</text>
    <text x="410" y="548" class="attr" fill="#666">full-image OCR via</text>
    <text x="410" y="562" class="attr" fill="#666">visclick.ocr.text_ground</text>
    <text x="410" y="576" class="attr" fill="#666">name = "ocr_only"</text>
  </g>

  <g id="PyWinAutoBaseline">
    <rect x="760" y="360" width="330" height="230" rx="4" class="concrete"/>
    <text x="925" y="378" class="stereo">&lt;&lt;classical / Windows UIA&gt;&gt;</text>
    <text x="925" y="395" class="title">PyWinAutoBaseline</text>
    <line x1="760" y1="402" x2="1090" y2="402" class="sep"/>
    <text x="770" y="418" class="attr">(stateless; no config)</text>
    <line x1="760" y1="424" x2="1090" y2="424" class="sep"/>
    <text x="770" y="440" class="method">+ predict(img, instr,</text>
    <text x="770" y="454" class="method">      target_uia_name=,</text>
    <text x="770" y="468" class="method">      target_uia_role=,</text>
    <text x="770" y="482" class="method">      offset=) &#8594; BaselineResult</text>
    <text x="770" y="500" class="method">- _can_run() &#8594; str | None</text>
    <text x="770" y="514" class="method">- _find(name, role) &#8594; UIA elem</text>
    <text x="770" y="538" class="attr" fill="#666">skips on non-Windows;</text>
    <text x="770" y="552" class="attr" fill="#666">walks UIA descendants</text>
    <text x="770" y="576" class="attr" fill="#666">name = "pywinauto"</text>
  </g>

  <g id="VisClickBaseline">
    <rect x="1120" y="360" width="350" height="230" rx="4" class="concrete"/>
    <text x="1295" y="378" class="stereo">&lt;&lt;neural / headline approach&gt;&gt;</text>
    <text x="1295" y="395" class="title">VisClickBaseline</text>
    <line x1="1120" y1="402" x2="1470" y2="402" class="sep"/>
    <text x="1130" y="418" class="attr">- weights: Path</text>
    <text x="1130" y="432" class="attr">- conf, iou: float</text>
    <text x="1130" y="446" class="attr">- ocr_engine: str</text>
    <text x="1130" y="460" class="attr">- min_text_similarity: int</text>
    <text x="1130" y="474" class="attr">- _detector: Detector | None (lazy)</text>
    <line x1="1120" y1="480" x2="1470" y2="480" class="sep"/>
    <text x="1130" y="496" class="method">+ __init__(weights=, conf=,</text>
    <text x="1130" y="510" class="method">           iou=, ocr_engine=, ...)</text>
    <text x="1130" y="524" class="method">+ predict(img, instr, offset=)</text>
    <text x="1130" y="538" class="method">   &#8594; BaselineResult</text>
    <text x="1130" y="552" class="method">- _get_detector() &#8594; Detector</text>
    <text x="1130" y="566" class="method">- _run_pipeline(img, instr, ...)</text>
    <text x="1130" y="580" class="attr" fill="#666">wraps the visclick.bot pipeline</text>
  </g>

  <!-- Inheritance arrows (dashed, open triangle at parent) -->
  <path d="M 205 360 L 205 320 L 750 320 L 750 240" class="inherit"/>
  <polygon points="750,240 743,254 750,262 757,254" class="diamond-open"/>

  <path d="M 565 360 L 565 310 L 750 310 L 750 240" class="inherit"/>

  <path d="M 925 360 L 925 310 L 750 310 L 750 240" class="inherit"/>

  <path d="M 1295 360 L 1295 320 L 750 320 L 750 240" class="inherit"/>

  <!-- Uses arrow: Baseline returns BaselineResult -->
  <path d="M 900 165 L 1000 165" class="use"/>
  <polygon points="1000,165 990,160 990,170" class="arrow"/>
  <text x="950" y="158" text-anchor="middle" class="caption">&lt;&lt; returns &gt;&gt;</text>

  <!-- Legend + note (bottom) -->
  <g transform="translate(40, 630)">
    <rect x="0" y="0" width="1430" height="115" fill="#fafafa" stroke="#cccccc"/>
    <text x="10" y="20" font-weight="bold">Legend and design notes</text>

    <line x1="10" y1="40" x2="80" y2="40" class="inherit"/>
    <polygon points="80,40 74,35 80,30 86,35" class="diamond-open"/>
    <text x="95" y="44">inheritance (open triangle) &#8212; every concrete baseline is a subclass of the Baseline ABC</text>

    <line x1="10" y1="62" x2="80" y2="62" class="use"/>
    <polygon points="80,62 74,58 74,66" class="arrow"/>
    <text x="95" y="66">dependency (dotted) &#8212; predict() returns a BaselineResult value object</text>

    <rect x="10" y="80" width="18" height="12" class="abs"/>
    <text x="35" y="90">Abstract base</text>
    <rect x="150" y="80" width="18" height="12" class="concrete"/>
    <text x="175" y="90">Concrete baseline</text>
    <rect x="325" y="80" width="18" height="12" class="dc"/>
    <text x="350" y="90">Data class (result)</text>

    <text x="640" y="90" class="caption">Each module also exposes a module-level predict(...) delegate to a default instance,</text>
    <text x="640" y="104" class="caption">so scripts/run_baselines.py (which imports each module and calls .predict) keeps working unchanged.</text>
  </g>
</svg>
