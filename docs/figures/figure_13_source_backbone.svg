<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="Arial, sans-serif" font-size="12">
  <text x="550" y="28" text-anchor="middle" font-size="17" font-weight="bold">Source-domain backbone comparison: YOLOv8s vs DETR-R50</text>
  <text x="550" y="48" text-anchor="middle" font-size="11" fill="#555">Same training set (8000 unified-bundle images), Colab T4 budget</text>

  <g>
    <text x="180" y="80" text-anchor="middle" font-weight="bold" font-size="13">mAP@0.5</text>
    <line x1="80"  y1="380" x2="80"  y2="100" stroke="#222"/>
    <line x1="80"  y1="380" x2="280" y2="380" stroke="#222"/>
    <text x="70" y="384" text-anchor="end" font-size="10">0.0</text>
    <text x="70" y="324" text-anchor="end" font-size="10">0.1</text>
    <text x="70" y="268" text-anchor="end" font-size="10">0.2</text>
    <text x="70" y="212" text-anchor="end" font-size="10">0.3</text>
    <text x="70" y="156" text-anchor="end" font-size="10">0.4</text>
    <text x="70" y="100" text-anchor="end" font-size="10">0.5</text>

    <rect x="100" y="128" width="60" height="252" fill="#3c8a3c"/>
    <text x="130" y="120" text-anchor="middle" font-size="11" font-weight="bold">0.450</text>
    <text x="130" y="400" text-anchor="middle" font-size="11">YOLOv8s</text>

    <rect x="200" y="244" width="60" height="136" fill="#5a3eaa"/>
    <text x="230" y="236" text-anchor="middle" font-size="11" font-weight="bold">0.244</text>
    <text x="230" y="400" text-anchor="middle" font-size="11">DETR-R50</text>

    <text x="180" y="425" text-anchor="middle" font-size="11" fill="#3c8a3c" font-weight="bold">YOLO ~ 1.85x DETR</text>
  </g>

  <g>
    <text x="500" y="80" text-anchor="middle" font-weight="bold" font-size="13">mAP@0.5:0.95</text>
    <line x1="400" y1="380" x2="400" y2="100" stroke="#222"/>
    <line x1="400" y1="380" x2="600" y2="380" stroke="#222"/>
    <text x="390" y="384" text-anchor="end" font-size="10">0.00</text>
    <text x="390" y="324" text-anchor="end" font-size="10">0.10</text>
    <text x="390" y="268" text-anchor="end" font-size="10">0.20</text>
    <text x="390" y="212" text-anchor="end" font-size="10">0.30</text>
    <text x="390" y="156" text-anchor="end" font-size="10">0.40</text>

    <rect x="420" y="184" width="60" height="196" fill="#3c8a3c"/>
    <text x="450" y="176" text-anchor="middle" font-size="11" font-weight="bold">0.350</text>
    <text x="450" y="400" text-anchor="middle" font-size="11">YOLOv8s</text>

    <rect x="520" y="290" width="60" height="90" fill="#5a3eaa"/>
    <text x="550" y="282" text-anchor="middle" font-size="11" font-weight="bold">0.161</text>
    <text x="550" y="400" text-anchor="middle" font-size="11">DETR-R50</text>

    <text x="500" y="425" text-anchor="middle" font-size="11" fill="#3c8a3c" font-weight="bold">YOLO ~ 2.17x DETR</text>
  </g>

  <g>
    <text x="850" y="80" text-anchor="middle" font-weight="bold" font-size="13">training time (h)</text>
    <line x1="750" y1="380" x2="750" y2="100" stroke="#222"/>
    <line x1="750" y1="380" x2="970" y2="380" stroke="#222"/>
    <text x="740" y="384" text-anchor="end" font-size="10">0</text>
    <text x="740" y="324" text-anchor="end" font-size="10">4</text>
    <text x="740" y="268" text-anchor="end" font-size="10">8</text>
    <text x="740" y="212" text-anchor="end" font-size="10">12</text>
    <text x="740" y="156" text-anchor="end" font-size="10">16</text>

    <rect x="770" y="342" width="60" height="38" fill="#3c8a3c"/>
    <text x="800" y="334" text-anchor="middle" font-size="11" font-weight="bold">2.7 h</text>
    <text x="800" y="400" text-anchor="middle" font-size="11">YOLOv8s</text>

    <rect x="870" y="156" width="60" height="224" fill="#a74545"/>
    <text x="900" y="148" text-anchor="middle" font-size="11" font-weight="bold">16 h</text>
    <text x="900" y="400" text-anchor="middle" font-size="11">DETR-R50</text>

    <text x="850" y="425" text-anchor="middle" font-size="11" fill="#a74545" font-weight="bold">DETR ~ 5.9x YOLO</text>
  </g>
</svg>
