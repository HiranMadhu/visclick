  <line x1="445" y1="80" x2="445" y2="430" stroke="#222" stroke-dasharray="6 4" stroke-width="1.2"/>
  <text x="265" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c8a3c">high cluster (60-69%)</text>
  <text x="765" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#a74545">low cluster (below 50%)</text>
  <text x="265" y="510" text-anchor="middle" font-size="11" fill="#666">zero-shot, k=1 head FT, AT short, AT full</text>
  <text x="765" y="510" text-anchor="middle" font-size="11" fill="#666">all SSP / SHOT variants and damaged head-FT runs</text>
