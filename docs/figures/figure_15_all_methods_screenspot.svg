    <text x="405" y="448" text-anchor="middle" font-size="10">k=0 zero-shot</text>

    <rect x="460" y="161" width="70" height="269" fill="#c08a2c"/>
    <text x="495" y="154" text-anchor="middle" font-size="11" font-weight="bold">45.81</text>
    <text x="495" y="448" text-anchor="middle" font-size="10">SSP+FT k=1</text>

    <rect x="550" y="229" width="70" height="201" fill="#a74545"/>
