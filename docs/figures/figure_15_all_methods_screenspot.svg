    <line x1="80" y1="316" x2="1080" y2="316"/>
    <line x1="80" y1="257" x2="1080" y2="257"/>
    <line x1="80" y1="198" x2="1080" y2="198"/>
    <line x1="80" y1="139" x2="1080" y2="139"/>
    <line x1="80" y1="80"  x2="1080" y2="80"/>
  </g>

  <g>
    <rect x="100" y="35"  width="70" height="395" fill="#3c8a3c"/>
    <text x="135" y="28" text-anchor="middle" font-size="11" font-weight="bold">68.56</text>
