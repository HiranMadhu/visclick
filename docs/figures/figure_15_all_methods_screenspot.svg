<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Arial, sans-serif" font-size="11">
  <text x="550" y="28" text-anchor="middle" font-size="17" font-weight="bold">All-method comparison on ScreenSpot CPV (desktop, n=334)</text>
  <text x="550" y="48" text-anchor="middle" font-size="11" fill="#555">Two clusters: high (60-69%) and low (below 50%)</text>

  <line x1="80"  y1="430" x2="1080" y2="430" stroke="#222"/>
  <line x1="80"  y1="430" x2="80"   y2="80"  stroke="#222"/>

  <g font-size="11" text-anchor="end">
    <text x="70" y="434">0%</text>
    <text x="70" y="375">10%</text>
    <text x="70" y="316">20%</text>
    <text x="70" y="257">30%</text>
    <text x="70" y="198">40%</text>
    <text x="70" y="139">50%</text>
    <text x="70" y="80">60%</text>
  </g>

  <g stroke="#ddd" stroke-dasharray="2 2">
