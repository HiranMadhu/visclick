    <rect x="190" y="37"  width="70" height="393" fill="#3c8a3c" opacity="0.92"/>
    <text x="225" y="30" text-anchor="middle" font-size="11" font-weight="bold">68.26</text>
    <text x="225" y="448" text-anchor="middle" font-size="10" font-weight="bold">k=1 head FT</text>
    <text x="225" y="461" text-anchor="middle" font-size="9" fill="#666">(deployed)</text>

    <rect x="280" y="58"  width="70" height="372" fill="#3c8a3c" opacity="0.85"/>
    <text x="315" y="51" text-anchor="middle" font-size="11" font-weight="bold">64.67</text>
