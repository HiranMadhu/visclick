<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Three-branch refusal rule</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#555">Decision flow at the orchestrator. Verdict is recorded in the per-attempt CSV.</text>

  <rect x="375" y="70" width="150" height="44" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="450" y="97" text-anchor="middle" font-weight="bold">screenshot</text>

  <rect x="375" y="140" width="150" height="44" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="450" y="167" text-anchor="middle" font-weight="bold">detect()</text>

  <line x1="450" y1="114" x2="450" y2="140" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>

  <polygon points="450,200 540,250 450,300 360,250" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="450" y="248" text-anchor="middle" font-weight="bold">candidates</text>
  <text x="450" y="266" text-anchor="middle" font-size="11">> 0 boxes?</text>
  <line x1="450" y1="184" x2="450" y2="200" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="540" y="240" font-size="12" font-weight="bold" fill="#3c8a3c">YES</text>
  <text x="345" y="240" font-size="12" font-weight="bold" fill="#a74545">NO (branch 1)</text>

  <polygon points="640,330 750,380 640,430 530,380" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="640" y="378" text-anchor="middle" font-weight="bold">match score</text>
  <text x="640" y="396" text-anchor="middle" font-size="11">e threshold?</text>

  <line x1="540" y1="250" x2="640" y2="330" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="745" y="365" font-size="12" font-weight="bold" fill="#3c8a3c">YES (branch 3)</text>
  <text x="525" y="345" font-size="12" font-weight="bold" fill="#c08a2c">NO (branch 2)</text>

  <rect x="800" y="358" width="80" height="44" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="840" y="385" text-anchor="middle" font-weight="bold">act</text>
  <line x1="750" y1="380" x2="800" y2="380" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="240" y="430" width="200" height="44" rx="6" fill="#fdeaea" stroke="#a74545"/>
  <text x="340" y="457" text-anchor="middle" font-weight="bold">OCR full-image fallback</text>
  <line x1="360" y1="300" x2="320" y2="430" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="540" y1="380" x2="440" y2="455" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>

  <polygon points="220,490 240,475 220,460 200,475" fill="#fff5e0" stroke="#c08a2c"/>
  <line x1="240" y1="475" x2="155" y2="475" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="180" y="495" text-anchor="middle" font-size="11">match found?</text>

  <rect x="55"  y="455" width="100" height="44" rx="6" fill="#fdeaea" stroke="#a74545"/>
  <text x="105" y="482" text-anchor="middle" font-weight="bold">refuse</text>

  <text x="125" y="450" font-size="11" fill="#a74545">no</text>
  <text x="245" y="450" font-size="11" fill="#3c8a3c">yes</text>
  <line x1="240" y1="475" x2="800" y2="385" stroke="#3c8a3c" stroke-width="1" stroke-dasharray="4 3"/>
</svg>
