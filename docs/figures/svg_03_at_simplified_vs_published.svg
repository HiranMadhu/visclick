<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="aar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="490" y="26" text-anchor="middle" font-size="18" font-weight="bold">Adaptive Teacher: published vs project's simplified offline variant</text>

  <text x="245" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5fb5">Published Adaptive Teacher (Li et al., 2022b)</text>
  <text x="735" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#a74545">Project simplification (offline pseudo-label loop)</text>

  <line x1="490" y1="50" x2="490" y2="560" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="60"  y="90" width="160" height="44" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="140" y="117" text-anchor="middle">labelled source</text>
  <rect x="270" y="90" width="160" height="44" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="350" y="117" text-anchor="middle">unlabelled target</text>

  <rect x="60"  y="170" width="160" height="44" rx="6" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="140" y="197" text-anchor="middle" font-weight="bold">student</text>
  <rect x="270" y="170" width="160" height="44" rx="6" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="350" y="197" text-anchor="middle" font-weight="bold">EMA teacher</text>

  <line x1="140" y1="134" x2="140" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>
  <line x1="350" y1="134" x2="350" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>

  <rect x="60" y="250" width="370" height="44" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="245" y="277" text-anchor="middle">mixed batch (labelled src + pseudo-labelled tgt) + discrepancy loss</text>

  <line x1="140" y1="214" x2="200" y2="250" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>
  <line x1="350" y1="214" x2="290" y2="250" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>

  <path d="M 220 250 C 230 230, 230 210, 270 195" fill="none" stroke="#3c8a3c" stroke-width="1.5" marker-end="url(#aar)"/>
  <text x="195" y="240" font-size="11" fill="#3c8a3c">EMA update</text>

  <rect x="60" y="330" width="370" height="44" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="245" y="357" text-anchor="middle">strong / weak augmentation pair</text>
  <line x1="245" y1="294" x2="245" y2="330" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>

  <text x="245" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c8a3c">stable across iterations</text>
  <text x="245" y="470" text-anchor="middle" font-size="12" fill="#444">EMA averages out per-step noise</text>
  <text x="245" y="488" text-anchor="middle" font-size="12" fill="#444">teacher quality monotonic with training</text>

  <rect x="540" y="90"  width="160" height="44" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="620" y="117" text-anchor="middle">labelled source</text>
  <rect x="750" y="90"  width="160" height="44" rx="6" fill="#dde7fb" stroke="#3a5fb5"/>
  <text x="830" y="117" text-anchor="middle">unlabelled target</text>

  <rect x="540" y="170" width="370" height="44" rx="6" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="725" y="197" text-anchor="middle" font-weight="bold">teacher (= prev iteration's student)</text>
  <line x1="620" y1="134" x2="620" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>
  <line x1="830" y1="134" x2="830" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>

  <rect x="540" y="250" width="370" height="44" rx="6" fill="#fdeaea" stroke="#a74545"/>
  <text x="725" y="277" text-anchor="middle">offline pseudo-label dump (no in-loop EMA)</text>
  <line x1="725" y1="214" x2="725" y2="250" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>

  <rect x="540" y="330" width="370" height="44" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="725" y="357" text-anchor="middle">student trains on mixed batch</text>
  <line x1="725" y1="294" x2="725" y2="330" stroke="#222" stroke-width="1.5" marker-end="url(#aar)"/>

  <path d="M 540 352 C 510 380, 510 220, 540 195" fill="none" stroke="#a74545" stroke-width="1.5" marker-end="url(#aar)"/>
  <text x="450" y="280" font-size="11" fill="#a74545">student becomes</text>
  <text x="450" y="295" font-size="11" fill="#a74545">next teacher</text>

  <text x="725" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#a74545">noise compounds across iterations</text>
  <text x="725" y="470" text-anchor="middle" font-size="12" fill="#444">no EMA stabiliser ' systematic errors</text>
  <text x="725" y="488" text-anchor="middle" font-size="12" fill="#444">amplified rather than averaged out</text>

  <text x="245" y="540" text-anchor="middle" font-size="12" fill="#3c8a3c">closes 2/3 of source-target gap on standard benchmarks</text>
  <text x="725" y="540" text-anchor="middle" font-size="12" fill="#a74545">3-iter run dropped 4 pts vs 1-iter (Section 8.3.2)</text>
</svg>
