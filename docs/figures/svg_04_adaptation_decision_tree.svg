<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="dar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>

  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="bold">Adaptation method decision tree</text>
  <text x="490" y="48" text-anchor="middle" font-size="12" fill="#555">Compact form of the synthesis in Section 8.3.5</text>

  <polygon points="490,80 600,130 490,180 380,130" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="490" y="125" text-anchor="middle" font-weight="bold">labelled target</text>
  <text x="490" y="145" text-anchor="middle" font-size="11">available?</text>

  <text x="610" y="115" font-size="12" fill="#3c8a3c">YES (a few)</text>
  <text x="370" y="115" text-anchor="end" font-size="12" fill="#a74545">NO</text>

  <rect x="610" y="200" width="200" height="60" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="710" y="225" text-anchor="middle" font-weight="bold">few-shot fine-tune</text>
  <text x="710" y="246" text-anchor="middle" font-size="11">k = 1 (the dissertation's pick)</text>
  <line x1="600" y1="130" x2="710" y2="200" stroke="#222" stroke-width="1.5" marker-end="url(#dar)"/>

  <polygon points="280,200 380,250 280,300 180,250" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="280" y="245" text-anchor="middle" font-weight="bold">unlabelled target</text>
  <text x="280" y="265" text-anchor="middle" font-size="11">aligned with source?</text>
  <line x1="380" y1="130" x2="280" y2="200" stroke="#222" stroke-width="1.5" marker-end="url(#dar)"/>

  <text x="385" y="220" font-size="12" fill="#3c8a3c">YES</text>
  <text x="170" y="220" text-anchor="end" font-size="12" fill="#a74545">NO</text>

  <rect x="380" y="320" width="200" height="60" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="480" y="345" text-anchor="middle" font-weight="bold">SSP+FT</text>
  <text x="480" y="366" text-anchor="middle" font-size="11">SimSiam pretrain ' fine-tune</text>
  <line x1="370" y1="250" x2="480" y2="320" stroke="#222" stroke-width="1.5" marker-end="url(#dar)"/>

  <polygon points="100,320 200,370 100,420 0,370" fill="#fff5e0" stroke="#c08a2c"/>
  <text x="100" y="365" text-anchor="middle" font-weight="bold">class boundaries</text>
  <text x="100" y="385" text-anchor="middle" font-size="11">stable across</text>
  <text x="100" y="400" text-anchor="middle" font-size="11">domains?</text>
  <line x1="190" y1="250" x2="125" y2="320" stroke="#222" stroke-width="1.5" marker-end="url(#dar)"/>

  <text x="225" y="350" font-size="12" fill="#3c8a3c">YES</text>
  <text x="0" y="350" font-size="12" fill="#a74545">NO</text>

  <rect x="180" y="450" width="200" height="60" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="280" y="475" text-anchor="middle" font-weight="bold">SHOT (light freeze)</text>
  <text x="280" y="496" text-anchor="middle" font-size="11">freeze head, adapt extractor</text>
  <line x1="200" y1="370" x2="280" y2="450" stroke="#222" stroke-width="1.5" marker-end="url(#dar)"/>

  <rect x="0" y="450" width="180" height="60" rx="6" fill="#eaf6ea" stroke="#3c8a3c"/>
  <text x="90" y="475" text-anchor="middle" font-weight="bold">Adaptive Teacher</text>
  <text x="90" y="496" text-anchor="middle" font-size="11">simplified offline, 1 outer iter</text>
  <line x1="90" y1="420" x2="90" y2="450" stroke="#222" stroke-width="1.5" marker-end="url(#dar)"/>

  <text x="490" y="565" text-anchor="middle" font-size="12" fill="#666">Empirical operating points reported: k=1 head FT 68.26% / AT short 68.56% / SSP+FT k=1 45.81% / SHOT freeze=10 34.13% (ScreenSpot CPV)</text>
</svg>
